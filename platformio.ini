; GNSS Explorer — standalone GPS/GNSS data explorer for the CYD + ATGM336H
;
; Stage 1: prove display + touch tabs + passive GPS reception on one board.
;
; Display/touch config is copied from the HARDWARE-VERIFIED OneBoard profile
; (esp32-2432s028) — ILI9341 on HSPI 12/13/14/15/2, XPT2046 on its own VSPI
; bus 25/32/39/33/36, USE_HSPI_PORT mandatory so the two buses stay separate.
;
; GPS: read passively on UART1 remapped to the UART0/USB pins (rx=3, tx=-1).
; tx=-1 means we NEVER drive GPIO1, so the ESP32 cannot contend with the GPS's
; own RX line. Baud 9600 is the module's NMEA default (Bruce's saved config
; agrees). Nothing is ever written back to the module — no config commands.

[env:esp32-2432s028]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_size = 4MB
upload_speed = 921600

build_flags =
    ; ---- display: ILI9341 on HSPI ----
    -DUSER_SETUP_LOADED
    -DILI9341_2_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DSPI_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DUSE_HSPI_PORT
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6

    ; ---- touch: XPT2046 on its own VSPI bus ----
    -DTOUCH_CS=33
    -DTOUCH_IRQ=36
    -DTOUCH_SCLK=25
    -DTOUCH_MOSI=32
    -DTOUCH_MISO=39

    ; ---- GPS (passive read only) ----
    -DGPS_RX_PIN=3
    -DGPS_TX_PIN=-1
    -DGPS_BAUD=9600
    ; Mirror diagnostics to the CH340 as well. Safe: we only ever transmit on
    ; GPIO1 (ESP32 TX), and never listen on UART0.
    -DENABLE_USB_SERIAL=1

lib_deps =
    bodmer/TFT_eSPI@^2.5.0
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

; ---------------------------------------------------------------
; GPS on a FREE pin (the correct wiring). The P1 TX/RX connector is
; hardwired to the CH340, which holds GPIO3 high, so a receiver's TX
; cannot drive that pin however it is wired.
; CN1 = GND, GPIO22, GPIO27, 3V3.  P3 = GND, GPIO35, GPIO22, GPIO21(BL).
; GPS RX is deliberately left undriven (-1): this firmware is passive.
; ---------------------------------------------------------------
[env:esp32-2432s028-gps22]
extends = env:esp32-2432s028
build_flags =
    ${env:esp32-2432s028.build_flags}
    -DGPS_RX_PIN=22
    -DGPS_TX_PIN=-1

; ---------------------------------------------------------------
; GPS on P1's TX pin (GPIO1) - what HaleHound's "GPS_bus": {"rx":1}
; does, and the only pin on that connector the CH340 does not drive.
; It costs the USB console: UART0's TX is GPIO1 too, so this build is
; silent and the LCD is the only readout.
; ---------------------------------------------------------------
[env:esp32-2432s028-gps1]
extends = env:esp32-2432s028
build_flags =
    ${env:esp32-2432s028.build_flags}
    -DGPS_RX_PIN=1
    -DGPS_TX_PIN=-1
    -DENABLE_USB_SERIAL=0

; ---------------------------------------------------------------
; Wiring diagnostic: sweeps candidate RX pins and reports which one
; is actually carrying NMEA (see probeRxPins in src/main.cpp).
; ---------------------------------------------------------------
[env:esp32-2432s028-probe]
extends = env:esp32-2432s028
build_flags =
    ${env:esp32-2432s028.build_flags}
    -DGNSS_PROBE_PINS=1
    -DPROBE_LOG_BAUD=9600

; ---------------------------------------------------------------
; Display diagnostic: backlight step, controller ID read, labelled
; colour steps, inversion test (see panelProbe in src/main.cpp).
; ---------------------------------------------------------------
[env:esp32-2432s028-panel]
extends = env:esp32-2432s028
build_flags =
    ${env:esp32-2432s028.build_flags}
    -DPANEL_PROBE=1

; ---------------------------------------------------------------
; Same panel, but with the ESP32-DIV/HaleHound panel options that the
; working firmware on this board uses: BGR order + inversion + 55MHz.
; ---------------------------------------------------------------
[env:esp32-2432s028-panel-div]
extends = env:esp32-2432s028
build_flags =
    ${env:esp32-2432s028.build_flags}
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON
    -DSPI_FREQUENCY=55000000

; ---------------------------------------------------------------
; Backlight hunt: drive every plausible BL pin, both polarities, on a
; loop, with the pin name drawn on the panel (see blSweep).
; ---------------------------------------------------------------
[env:esp32-2432s028-bl]
extends = env:esp32-2432s028
build_flags =
    ${env:esp32-2432s028.build_flags}
    -DBL_SWEEP=1

; ---------------------------------------------------------------
; Stage 4: SD logging on the working wiring (receiver on GPIO1).
; Writes the raw NMEA stream to /gps on the microSD card.
; ---------------------------------------------------------------
[env:esp32-2432s028-gps1-log]
extends = env:esp32-2432s028
build_flags =
    ${env:esp32-2432s028.build_flags}
    -DGPS_RX_PIN=1
    -DGPS_TX_PIN=-1
    -DENABLE_USB_SERIAL=0
    -DENABLE_SD_LOG=1

; ---------------------------------------------------------------
; SD + touch coexistence probe. Answers the only two questions that
; matter before logging is trusted: does the card mount on this unit,
; and does the touch panel still answer once the shared VSPI bus has
; been re-routed to the card and back? Console stays ON here.
; ---------------------------------------------------------------
[env:esp32-2432s028-sdprobe]
extends = env:esp32-2432s028
build_flags =
    ${env:esp32-2432s028.build_flags}
    -DSD_PROBE=1
    -DENABLE_SD_LOG=1

; ---------------------------------------------------------------
; SD logging with the USB console LEFT ON (receiver on GPIO3, which is
; the console's RX pad - the ESP32 never transmits, so nothing is
; disturbed). Exists so the whole log pipeline can be verified from the
; PC: mount, sentences received, sentences written, errors.
; ---------------------------------------------------------------
[env:esp32-2432s028-gps3-log]
extends = env:esp32-2432s028
build_flags =
    ${env:esp32-2432s028.build_flags}
    -DGPS_RX_PIN=3
    -DGPS_TX_PIN=-1
    -DENABLE_USB_SERIAL=1
    -DENABLE_SD_LOG=1

; ---------------------------------------------------------------
; FIELD BUILD: SD logging, no USB console, receiver pin auto-detected
; (GPIO1 -> GPIO22 -> GPIO27, first pin that yields validated
; sentences wins). Console is off, so GPIO1 is free to be listened
; on, and the chosen pin is shown on the Raw tab and written into
; the log's own status lines.
; ---------------------------------------------------------------
[env:esp32-2432s028-gnssauto-log]
extends = env:esp32-2432s028
build_flags =
    ${env:esp32-2432s028.build_flags}
    -DGPS_AUTO_DETECT=1
    -DGPS_RX_PIN=1
    -DGPS_TX_PIN=-1
    -DENABLE_USB_SERIAL=0
    -DENABLE_SD_LOG=1

; Console variant of the field build. Cannot scan GPIO1: GPIO1 is the board's only
; path to the CH340, so a live console owns that pad and a receiver TX there would
; fight it. Scans GPIO22/27 only, which is enough to watch the scan machinery and
; the log pipeline from the PC.
[env:esp32-2432s028-gnssauto-probe]
extends = env:esp32-2432s028
build_flags =
    ${env:esp32-2432s028.build_flags}
    -DGPS_AUTO_DETECT=1
    -DGPS_RX_PIN=1
    -DGPS_TX_PIN=-1
    -DENABLE_USB_SERIAL=1
    -DENABLE_SD_LOG=1
    -DGPS_SCAN_PINS=22,27
